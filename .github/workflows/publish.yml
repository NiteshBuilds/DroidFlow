name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI
on: push

jobs:
  version-check:
    name: Check version matches tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Compare tag to root version
      run: |
        TAG="${GITHUB_REF#refs/tags/v}"
        ROOT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)

        if [ "$TAG" != "$ROOT_VERSION" ]; then
          echo "::error::Tag v$TAG does not match pyproject.toml version $ROOT_VERSION"
          exit 1
        fi
        echo "Version check passed: v$ROOT_VERSION"

  build:
    name: Build mobilerun 📦
    needs:
    - version-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: python3 -m pip install build --user
    - name: Build mobilerun (root package)
      run: python3 -m build
    - name: Verify package built
      run: |
        ls dist/mobilerun-*.whl dist/mobilerun-*.tar.gz
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: Publish mobilerun to TestPyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mobilerun
    permissions:
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish mobilerun to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish mobilerun to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
    - publish-to-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mobilerun
    permissions:
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish mobilerun to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
